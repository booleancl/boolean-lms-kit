{%- comment -%}
  Presentación reveal.js desde Markdown. Separadores: `---` horizontal, `--` vertical, `Note:` notas.
{%- endcomment -%}
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-CL' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  {% vite_client_tag %}
  {% lms_entrypoint reveal %}
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown data-separator="^---" data-separator-vertical="^--" data-separator-notes="^Note:" data-charset="utf-8">
        <textarea data-template>
{{ content }}
        </textarea>
      </section>
    </div>
  </div>
</body>
</html>
